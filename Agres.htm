<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agres 3 - Webcam Full Responsive</title>
  <style>
    /* Estilos globales para fondo negro y centrado vertical */
    body { 
      background: #000; 
      color: #fff; 
      font-family: system-ui, -apple-system, sans-serif; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; /* Centra la imagen verticalmente si sobra espacio arriba/abajo */
      min-height: 100vh; 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box;
      /* overflow: auto;  Permite scroll vertical si la imagen es grande */
    }

    /* Contenedor principal que ocupa todo el ancho */
    .img-container {
      width: 100%;
      height: auto; /* El alto lo define la imagen al estirarse */
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 50px; /* Espacio para que el texto de estado no pise la foto */
    }

    /* Estilos de la imagen para que sea RESPONSIVE TOTAL */
    img { 
      /* FUERZA el ancho al 100% de la pantalla, tocando los extremos */
      width: 100vw; /* 'vw' significa viewport width, 100% del ancho visible */
      max-width: 100vw; /* Asegura que no se pase */
      
      /* Mantiene la proporción de aspecto original para no deformar */
      height: auto; 
      
      /* Elimina object-fit para que se comporte como una imagen responsive tradicional */
      object-fit: fill; /* O 'cover' si quieres que recorte un poco pero llene siempre */
      
      border-radius: 0; /* Sin bordes redondeados para que toque los extremos perfectamente */
      display: block; /* Elimina espacios vacíos debajo de la imagen */
    }

    /* Estilo para el texto de estado en la parte inferior fixed */
    .status { 
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.85);
      padding: 12px 0;
      font-size: 14px; 
      color: #00ffcc; 
      text-align: center;
      line-height: 1.4;
      border-top: 1px solid rgba(255,255,255,0.1);
      z-index: 10;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="img-container">
    <img id="webcam" src="https://www.avametnuvol.es/estacions/c26m003e04/agres3.jpg" alt="Webcam Agres">
  </div>
  
  <div class="status" id="clock">Iniciando conexión...</div>

  <script>
    const SEGUNDOS_REFRESCO = 150; 
    const URL_BASE = 'https://www.avametnuvol.es/estacions/c26m003e04/agres3.jpg';

    function recargar() {
      const imgVisible = document.getElementById('webcam');
      const clock = document.getElementById('clock');
      
      const ahora = new Date();
      const proxima = new Date(ahora.getTime() + (SEGUNDOS_REFRESCO * 1000));
      
      const imgOculta = new Image();
      const nuevaUrl = URL_BASE + '?t=' + ahora.getTime();

      imgOculta.onload = function() {
        imgVisible.src = nuevaUrl;
        
        const horaActualStr = ahora.toLocaleTimeString();
        const horaProximaStr = proxima.toLocaleTimeString();
        clock.innerText = 'Última recarga: ' + horaActualStr + ' | Próximo refresco: ' + horaProximaStr;
      };

      imgOculta.src = nuevaUrl;
    }

    recargar();
    setInterval(recargar, SEGUNDOS_REFRESCO * 1000);
  </script>
</body>
</html>
