<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agres 3 - Webcam Live</title>
  <style>
    /* Estilos globales */
    body { 
      background: #000; 
      color: #fff; 
      font-family: system-ui, -apple-system, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box;
    }

    /* Contenedor principal: alinea imagen y texto juntos */
    .cam-wrapper {
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Imagen responsive a ancho completo */
    img { 
      width: 100vw; 
      max-width: 100vw; 
      height: auto; 
      display: block; 
    }

    /* Leyenda pegada a la imagen */
    .status { 
      width: 100vw;
      background: rgba(0, 0, 0, 0.85);
      padding: 8px 0;
      font-size: 13px; 
      color: #00ffcc; 
      text-align: center;
      line-height: 1.4;
      box-sizing: border-box;
      /* Margen mínimo superior para separarla un toque fino de la foto */
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="cam-wrapper">
    <img id="webcam" src="https://www.avametnuvol.es/estacions/c26m003e04/agres3.jpg" alt="Webcam Agres">
    <div class="status" id="clock">Iniciando conexión...</div>
  </div>

  <script>
    const SEGUNDOS_REFRESCO = 150; 
    const URL_BASE = 'https://www.avametnuvol.es/estacions/c26m003e04/agres3.jpg';

    function recargar() {
      const imgVisible = document.getElementById('webcam');
      const clock = document.getElementById('clock');
      
      const ahora = new Date();
      const proxima = new Date(ahora.getTime() + (SEGUNDOS_REFRESCO * 1000));
      
      const imgOculta = new Image();
      const nuevaUrl = URL_BASE + '?t=' + ahora.getTime();

      imgOculta.onload = function() {
        imgVisible.src = nuevaUrl;
        
        const horaActualStr = ahora.toLocaleTimeString();
        const horaProximaStr = proxima.toLocaleTimeString();
        clock.innerText = 'Última recarga: ' + horaActualStr + ' | Próximo refresco: ' + horaProximaStr;
      };

      imgOculta.src = nuevaUrl;
    }

    recargar();
    setInterval(recargar, SEGUNDOS_REFRESCO * 1000);
  </script>
</body>
</html>
