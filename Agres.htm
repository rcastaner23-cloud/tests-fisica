<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agres 3 - Webcam Live</title>
  <style>
    body { 
      background: #000; 
      color: #fff; 
      font-family: system-ui, -apple-system, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 10px;
      box-sizing: border-box;
    }
    img { 
      max-width: 100%; 
      max-height: 80vh; 
      object-fit: contain; 
      border-radius: 8px; 
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
    }
    .status { 
      margin-top: 15px; 
      font-size: 14px; 
      color: #00ffcc; 
      text-align: center;
    }
  </style>
</head>
<body>

  <img id="webcam" src="https://www.avametnuvol.es/estacions/c26m003e04/agres3.jpg" alt="Webcam Agres">
  <div class="status" id="clock">Iniciando conexión...</div>

  <script>
    // Tiempo de refresco exacto: 150 segundos
    const SEGUNDOS_REFRESCO = 150; 

    function recargar() {
      const img = document.getElementById('webcam');
      const clock = document.getElementById('clock');
      const ahora = new Date();
      
      // Creamos una nueva URL con timestamp para saltarnos la caché del navegador
      const nuevaUrl = 'https://www.avametnuvol.es/estacions/c26m003e04/agres3.jpg?t=' + ahora.getTime();
      
      // Asignamos la nueva ruta
      img.src = nuevaUrl;
      
      // Actualizamos el mensaje de texto informativo
      clock.innerText = 'Última recarga: ' + ahora.toLocaleTimeString() + ' | Próximo refresco en ' + SEGUNDOS_REFRESCO + 's';
    }

    // Ejecuta la recarga nada más cargar la página
    recargar();

    // Activa el intervalo continuo cada 150.000 milisegundos
    setInterval(recargar, SEGUNDOS_REFRESCO * 1000);
  </script>
</body>
</html>
