<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agres 3 - Webcam Live</title>
  <!-- Librería externa para zoom fluido y arrastre -->
  <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body { 
      background: #000; 
      color: #fff; 
      font-family: system-ui, -apple-system, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      padding: 10px;
      overflow: hidden;
    }

    .cam-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 100vw;
    }

    .img-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
    }

    .img-container:active {
      cursor: grabbing;
    }

    img { 
      width: 100%;
      height: auto;
      max-height: 80vh; 
      object-fit: contain; 
      display: block; 
      border-radius: 4px;
    }

    .status { 
      width: 100%;
      background: rgba(0, 0, 0, 0.9);
      padding: 8px 12px;
      font-size: 13px; 
      color: #00ffcc; 
      text-align: center;
      line-height: 1.4;
      margin-top: 8px;
      border-radius: 4px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="cam-wrapper">
    <div class="img-container">
      <img id="webcam" src="https://www.avametnuvol.es/estacions/c26m003e04/agres3.jpg" alt="Webcam Agres">
    </div>
    <div class="status" id="clock">Iniciando conexión...</div>
  </div>

  <script>
    const SEGUNDOS_REFRESCO = 150; 
    const URL_BASE = 'https://www.avametnuvol.es/estacions/c26m003e04/agres3.jpg';

    // --- RECARGA AUTOMÁTICA ---
    function recargar() {
      const imgVisible = document.getElementById('webcam');
      const clock = document.getElementById('clock');
      
      const ahora = new Date();
      const proxima = new Date(ahora.getTime() + (SEGUNDOS_REFRESCO * 1000));
      
      const imgOculta = new Image();
      const nuevaUrl = URL_BASE + '?t=' + ahora.getTime();

      imgOculta.onload = function() {
        imgVisible.src = nuevaUrl;
        
        const horaActualStr = ahora.toLocaleTimeString();
        const horaProximaStr = proxima.toLocaleTimeString();
        clock.innerText = 'Última recarga: ' + horaActualStr + ' | Próximo refresco: ' + horaProximaStr;
      };

      imgOculta.src = nuevaUrl;
    }

    recargar();
    setInterval(recargar, SEGUNDOS_REFRESCO * 1000);

    // --- ACTIVAR ZOOM Y PANZOOM EN PC Y MÓVIL ---
    const elem = document.getElementById('webcam');
    const panzoom = Panzoom(elem, {
      maxScale: 5,
      minScale: 1,
      contain: 'outside'
    });

    // Activar zoom con la rueda del ratón
    const parent = elem.parentElement;
    parent.addEventListener('wheel', panzoom.zoomWithWheel);
  </script>
</body>
</html>
