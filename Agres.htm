    }

  <script>
    // Tiempo de refresco en segundos (150s = 2m 30s)
    const SEGUNDOS_REFRESCO = 150; 

    function recargar() {
      const img = document.getElementById('webcam');
      const clock = document.getElementById('clock');
      
      const ahora = new Date();
      
      // Calculamos la hora de la próxima recarga sumando los milisegundos de refresco
      const proxima = new Date(ahora.getTime() + (SEGUNDOS_REFRESCO * 1000));
      
      // Forzamos la descarga de la imagen más reciente mediante timestamp
