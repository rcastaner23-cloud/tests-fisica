<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agres 3 - Webcam Live</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body { 
      background: #000; 
      color: #fff; 
      font-family: system-ui, -apple-system, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      padding: 10px;
      overflow: hidden; /* Evita barras de scroll al ampliar en PC */
    }

    .cam-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 100vw;
    }

    /* Área que permite el zoom interactivo */
    .img-container {
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: zoom-in;
    }

    img { 
      width: 100%;
      height: auto;
      max-height: 82vh; 
      object-fit: contain; 
      display: block; 
      border-radius: 4px;
      /* Transición suave para el zoom */
      transform-origin: center center;
      transition: transform 0.1s ease-out;
    }

    .status { 
      width: 100%;
      background: rgba(0, 0, 0, 0.9);
      padding: 8px 12px;
      font-size: 13px; 
      color: #00ffcc; 
      text-align: center;
      line-height: 1.4;
      margin-top: 6px;
      border-radius: 4px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="cam-wrapper">
    <div class="img-container" id="zoomContainer">
      <img id="webcam" src="https://www.avametnuvol.es/estacions/c26m003e04/agres3.jpg" alt="Webcam Agres">
    </div>
    <div class="status" id="clock">Iniciando conexión...</div>
  </div>

  <script>
    const SEGUNDOS_REFRESCO = 150; 
    const URL_BASE = 'https://www.avametnuvol.es/estacions/c26m003e04/agres3.jpg';

    // --- LÓGICA DE RECARGA AUTOMÁTICA ---
    function recargar() {
      const imgVisible = document.getElementById('webcam');
      const clock = document.getElementById('clock');
      
      const ahora = new Date();
      const proxima = new Date(ahora.getTime() + (SEGUNDOS_REFRESCO * 1000));
      
      const imgOculta = new Image();
      const nuevaUrl = URL_BASE + '?t=' + ahora.getTime();

      imgOculta.onload = function() {
        imgVisible.src = nuevaUrl;
        
        const horaActualStr = ahora.toLocaleTimeString();
        const horaProximaStr = proxima.toLocaleTimeString();
        clock.innerText = 'Última recarga: ' + horaActualStr + ' | Próximo refresco: ' + horaProximaStr;
      };

      imgOculta.src = nuevaUrl;
    }

    recargar();
    setInterval(recargar, SEGUNDOS_REFRESCO * 1000);

    // --- LÓGICA DE ZOOM CON RUEDA DEL RATÓN (PC) ---
    const img = document.getElementById('webcam');
    const container = document.getElementById('zoomContainer');
    let scale = 1;

    container.addEventListener('wheel', function(e) {
      e.preventDefault(); // Evita el scroll normal de la página

      // Determina la dirección del zoom (arriba = ampliar, abajo = reducir)
      if (e.deltaY < 0) {
        scale += 0.15; // Mueve la rueda hacia arriba (zoom in)
      } else {
        scale -= 0.15; // Mueve la rueda hacia abajo (zoom out)
      }

      // Límites del zoom: mínimo 1x (tamaño normal), máximo 4x
      scale = Math.min(Math.max(1, scale), 4);

      // Cambia el cursor según el nivel de zoom
      container.style.cursor = scale > 1 ? 'zoom-out' : 'zoom-in';

      // Aplica el escalado
      img.style.transform = `scale(${scale})`;
    }, { passive: false });

    // Hacer doble clic para reiniciar el zoom en PC
    container.addEventListener('dblclick', function() {
      scale = 1;
      img.style.transform = `scale(1)`;
      container.style.cursor = 'zoom-in';
    });
  </script>
</body>
</html>
