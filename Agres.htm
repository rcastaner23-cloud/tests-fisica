<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agres 3 - Webcam Fullscreen Smart</title>
  <style>
    /* Estilos globales */
    body { 
      background: #000; 
      color: #fff; 
      font-family: system-ui, -apple-system, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box;
      overflow: hidden; /* Evita scrolls accidentales */
    }

    /* Contenedor principal: alinea imagen y texto juntos */
    .cam-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Ocupa todo el espacio disponible */
      width: 100vw;
      height: 100vh;
      max-height: 100vh;
    }

    /* Contenedor específico de la imagen para centrado perfecto */
    .img-box {
      flex: 1; /* Ocupa el espacio disponible sobre el texto */
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      overflow: hidden;
    }

    /* Imagen inteligente y responsive total */
    img { 
      /* Intenta ocupar todo el ancho disponible */
      width: 100%;
      max-width: 100vw;
      
      /* Mantiene la proporción original sin deformar */
      height: auto; 
      
      /* CLAVE: No puede superar el alto de su contenedor (pantalla - texto) */
      max-height: 100%;
      
      /* Ajuste inteligente para centrar si sobran franjas negras */
      object-fit: contain; 
      
      display: block; 
    }

    /* Leyenda pegada justo debajo de la imagen */
    .status { 
      width: 100vw;
      background: rgba(0, 0, 0, 0.9);
      padding: 10px 0;
      font-size: 13px; 
      color: #00ffcc; 
      text-align: center;
      line-height: 1.4;
      box-sizing: border-box;
      border-top: 1px solid rgba(255,255,255,0.1);
      /* Asegura que el texto no flote si la imagen es pequeña */
      margin-top: auto; 
    }
  </style>
</head>
<body>

  <div class="cam-wrapper">
    <div class="img-box">
      <img id="webcam" src="https://www.avametnuvol.es/estacions/c26m003e04/agres3.jpg" alt="Webcam Agres">
    </div>
    <div class="status" id="clock">Iniciando conexión...</div>
  </div>

  <script>
    const SEGUNDOS_REFRESCO = 150; 
    const URL_BASE = 'https://www.avametnuvol.es/estacions/c26m003e04/agres3.jpg';

    function recargar() {
      const imgVisible = document.getElementById('webcam');
      const clock = document.getElementById('clock');
      
      const ahora = new Date();
      const proxima = new Date(ahora.getTime() + (SEGUNDOS_REFRESCO * 1000));
      
      const imgOculta = new Image();
      const nuevaUrl = URL_BASE + '?t=' + ahora.getTime();

      imgOculta.onload = function() {
        imgVisible.src = nuevaUrl;
        
        const horaActualStr = ahora.toLocaleTimeString();
        const horaProximaStr = proxima.toLocaleTimeString();
        clock.innerText = 'Última recarga: ' + horaActualStr + ' | Próximo refresco: ' + horaProximaStr;
      };

      imgOculta.src = nuevaUrl;
    }

    recargar();
    setInterval(recargar, SEGUNDOS_REFRESCO * 1000);
  </script>
</body>
</html>
