<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Agres 3 - Webcam Full PC Zoom</title>
  
  <!-- Librería externa Panzoom (CDN) -->
  <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { 
      background: #000; 
      color: #fff; 
      font-family: system-ui, -apple-system, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      padding: 10px;
      overflow: hidden; /* Evita scrolls accidentales en la página */
    }

    .cam-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
    }

    /* Área interactiva del zoom */
    .img-container {
      flex: 1; /* Ocupa el espacio disponible */
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* Importante para que la imagen no salga de aquí al ampliar */
      cursor: grab;
    }

    .img-container:active { cursor: grabbing; }

    /* Imagen inteligente */
    img { 
      /* ESTADO INICIAL: cabe entera en pantalla */
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 82vh; /* Deja espacio para el texto de abajo */
      
      object-fit: contain; 
      display: block; 
      border-radius: 4px;
      
      /* Permite que el JavaScript cambie el tamaño libremente */
      transform-origin: 50% 50%;
    }

    .status { 
      width: 100%;
      background: rgba(0, 0, 0, 0.9);
      padding: 8px 12px;
      font-size: 13px; 
      color: #00ffcc; 
      text-align: center;
      line-height: 1.4;
      margin-top: 8px;
      border-radius: 4px;
      z-index: 10; /* Asegura que se vea sobre la imagen ampliada */
    }
  </style>
</head>
<body>

  <div class="cam-wrapper">
    <div class="img-container" id="panzoom-parent">
      <img id="webcam" src="https://www.avametnuvol.es/estacions/c26m003e04/agres3.jpg" alt="Webcam Agres">
    </div>
    <div class="status" id="clock">Iniciando conexión...</div>
  </div>

  <script>
    // --- LÓGICA DE RECARGA AUTOMÁTICA (MANTIENE ZOOM) ---
    const SEGUNDOS_REFRESCO = 150; 
    const URL_BASE = 'https://www.avametnuvol.es/estacions/c26m003e04/agres3.jpg';

    function recargar() {
      const imgVisible = document.getElementById('webcam');
      const clock = document.getElementById('clock');
      
      const ahora = new Date();
      const proxima = new Date(ahora.getTime() + (SEGUNDOS_REFRESCO * 1000));
      
      const imgOculta = new Image();
      const nuevaUrl = URL_BASE + '?t=' + ahora.getTime();

      imgOculta.onload = function() {
        // Obtenemos el estado actual del zoom antes de cambiar la foto
        const currentScale = panzoom.getScale();
        const currentPan = panzoom.getPan();

        // Sustituimos la foto
        imgVisible.src = nuevaUrl;
        
        // RESTAURAMOS el zoom y posición instantáneamente
        // (Nota:contain:'outside' requiere que hagamos esto con cuidado)
        setTimeout(() => {
            panzoom.zoom(currentScale, { animate: false });
            panzoom.pan(currentPan.x, currentPan.y, { animate: false });
        }, 10);
        
        // Actualizamos el texto
        clock.innerText = 'Última recarga: ' + ahora.toLocaleTimeString() + ' | Próximo: ' + proxima.toLocaleTimeString();
      };

      imgOculta.src = nuevaUrl;
    }

    // --- ACTIVAR PANZOOM INTELIGENTE ---
    const elem = document.getElementById('webcam');
    const parent = document.getElementById('panzoom-parent');

    // Configuración de Panzoom
    const panzoom = Panzoom(elem, {
      maxScale: 6, // Permite ampliar mucho (6x)
      minScale: 1, // No permite empequeñecer más del 100%
      contain: 'outside', // No deja franjas negras al arrastrar
      cursor: 'grab'
    });

    // CLAVE PARA PC: Secuestrar la rueda del ratón e interpretarla como zoom
    parent.addEventListener('wheel', panzoom.zoomWithWheel);

    // COMODIDAD: Doble clic para resetear el zoom
    parent.addEventListener('dblclick', () => panzoom.reset());

    // Iniciar bucle
    recargar();
    setInterval(recargar, SEGUNDOS_REFRESCO * 1000);
  </script>
</body>
</html>
