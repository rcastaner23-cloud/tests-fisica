<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Agres 3 - Webcam Live</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body { 
      background: #000; 
      color: #fff; 
      font-family: system-ui, -apple-system, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: flex-start; 
      min-height: 100vh; 
      padding: 10px;
      overflow: auto; /* Permite scroll horizontal y vertical */
    }

    .cam-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }

    .img-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto;
      overflow: visible;
      padding: 10px 0;
    }

    img { 
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 82vh; 
      object-fit: contain; 
      display: block; 
      margin: 0 auto;
      border-radius: 4px;
      
      /* CLAVE: Cambiamos el origen para que al ampliar no se pierda nada por la izquierda */
      transform-origin: top center;
      transition: transform 0.1s ease-out;
    }

    .status { 
      width: 100%;
      max-width: 800px;
      background: rgba(0, 0, 0, 0.9);
      padding: 8px 12px;
      font-size: 13px; 
      color: #00ffcc; 
      text-align: center;
      line-height: 1.4;
      margin: 8px auto 0 auto;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="cam-wrapper">
    <div class="img-container">
      <img id="webcam" src="https://www.avametnuvol.es/estacions/c26m003e07/eltossal.jpg" alt="Webcam Agres">
    </div>
    <div class="status" id="clock">Iniciando conexión...</div>
  </div>

  <script>
    const SEGUNDOS_REFRESCO = 133; 
    const URL_BASE = 'https://www.avametnuvol.es/estacions/c26m003e07/eltossal.jpg';

    // --- RECARGA AUTOMÁTICA ---
    function recargar() {
      const imgVisible = document.getElementById('webcam');
      const clock = document.getElementById('clock');
      
      const ahora = new Date();
      const proxima = new Date(ahora.getTime() + (SEGUNDOS_REFRESCO * 1000));
      
      const imgOculta = new Image();
      const nuevaUrl = URL_BASE + '?t=' + ahora.getTime();

      imgOculta.onload = function() {
        imgVisible.src = nuevaUrl;
        
        const horaActualStr = ahora.toLocaleTimeString();
        const horaProximaStr = proxima.toLocaleTimeString();
        clock.innerText = 'Última recarga: ' + horaActualStr + ' | Próximo refresco: ' + horaProximaStr;
      };

      imgOculta.src = nuevaUrl;
    }

    recargar();
    setInterval(recargar, SEGUNDOS_REFRESCO * 1000);

    // --- ZOOM EXCLUSIVO PARA PC CON LA RUEDA DEL RATÓN ---
    const img = document.getElementById('webcam');
    let scale = 1;

    window.addEventListener('wheel', function(e) {
      if ('ontouchstart' in window && e.pointerType === 'touch') return;

      e.preventDefault();

      if (e.deltaY < 0) {
        scale += 0.15;
      } else {
        scale -= 0.15;
      }

      scale = Math.min(Math.max(1, scale), 4);
      
      // Ajustamos el origen del transform según si hay zoom o no para mantener el centrado inicial
      if (scale > 1) {
        img.style.transformOrigin = 'top left';
        img.style.margin = '0';
      } else {
        img.style.transformOrigin = 'top center';
        img.style.margin = '0 auto';
      }

      img.style.transform = `scale(${scale})`;
    }, { passive: false });

    // Doble clic en PC para resetear
    img.addEventListener('dblclick', function() {
      scale = 1;
      img.style.transformOrigin = 'top center';
      img.style.margin = '0 auto';
      img.style.transform = `scale(1)`;
    });
  </script>
</body>
</html>
